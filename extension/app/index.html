<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EarMark</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-actions">
      <button id="export-btn" type="button" title="Download all lists as a JSON file">Export</button>
      <button id="import-btn" type="button" title="Merge lists from an exported JSON file">Import</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden />
    </div>
    <div id="video-groups"></div>
    <p id="empty-hint">Load a video, then press SPACE while it plays to mark a moment.</p>
  </aside>
  <main>
    <form id="load-form">
      <input id="url-input" type="text" placeholder="Paste a YouTube URL…" autocomplete="off" />
      <button type="submit">Load</button>
    </form>
    <p id="error" hidden></p>
    <div id="player-wrap">
      <iframe id="player" title="YouTube player" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div id="controls">
      <button id="mark-btn" type="button">⏺ Mark (Space)</button>
      <label>Rewind offset
        <input id="offset-input" type="number" min="0" step="1" value="3" />
        seconds
      </label>
      <label>Translate
        <select id="translate-select">
          <option value="">Off</option>
          <option value="zh-Hans">中文（简体）</option>
          <option value="zh-Hant">中文（繁體）</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
        </select>
      </label>
      <button id="translation-toggle" type="button" title="Show or hide the translated lines">Show translation</button>
    </div>
  </main>
  <script src="helpers.js"></script>
  <script src="store.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
